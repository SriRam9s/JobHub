<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Apply - JobHub</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            Job<span>Hub</span>
        </div>

        <div class="nav-links">

            <a href="/">
                Home
            </a>

            <a href="/jobs">
                Find Jobs
            </a>

            <a href="/dashboard">
                Dashboard
            </a>

        </div>

        <div class="nav-buttons">

            <a href="/logout"
               class="register-btn">
                Logout
            </a>

        </div>

    </nav>


    <main class="application-container">

        <div class="application-card">

            <p class="section-label">
                JOB APPLICATION
            </p>

            <h1>
                Apply for {{ job.title }}
            </h1>

            <p class="application-company">
                {{ job.company_name }}
            </p>


            <form
                method="POST"
                action="{{ url_for('apply_job', job_id=job.id) }}">


                <div class="form-group">

                    <label>
                        Resume
                    </label>

                    <input
                        type="text"
                        name="resume"
                        placeholder="Enter resume file name or link"
                        required>

                    <small>
                        Example:
                        resume.pdf
                        or your resume URL
                    </small>

                </div>


                <div class="form-group">

                    <label>
                        Cover Letter
                    </label>

                    <textarea
                        name="cover_letter"
                        rows="8"
                        placeholder="Write a short cover letter..."
                        required></textarea>

                </div>


                <button
                    type="submit"
                    class="auth-button">

                    Submit Application

                </button>


                <a
                    href="{{ url_for('job_details', job_id=job.id) }}"
                    class="cancel-link">

                    ← Back to Job

                </a>

            </form>

        </div>

    </main>

</body>

</html>
